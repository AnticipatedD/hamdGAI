name: Continuous Integration Architecture Platform

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository codebase targets
      uses: actions/checkout@v4

    - name: Set up Python Runtime execution layers
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install software framework along with developer tools
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Execute automated security vulnerability audits
      run: pip-audit

    - name: Check code cleanliness patterns (Linter metrics verify)
      run: ruff check .

    - name: Verify static interface signature bindings (Type-check verify)
      run: mypy .

    - name: Run test suite enforcement checking strict code coverage tracking rules
      run: |
        pytest --cov=. --cov-fail-under=60 -v tests/
            - name: Setup Terraform Core Engine
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

    - name: Validate Infrastructure Style Layouts
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validation 
      name: hamdGAI ROCm CI/CD Pipeline

      on:
    push:
branches: [ main, develop ] 
pull_request:
branches: [ main ]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting & Static Analysis Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black mypy pytest pytest-cov

      - name: Code Style Check (Black & Flake8)
        run: |
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Static Type Checking (Mypy)
        run: |
          mypy --ignore-missing-imports hamdgai/

  unit-tests:
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest pytest-cov

      - name: Run Test Suite (CPU Fallback Check)
        run: |
          pytest tests/ -v --cov=hamdgai --cov-report=xml

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: fals
