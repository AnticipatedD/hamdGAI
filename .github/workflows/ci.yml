name: hamdGAI ROCm Architecture CI/CD Platform

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Execute Strict Security Vulnerability Audit
        run: pip-audit

      - name: Code Style Verification (Black, Flake8 & Ruff)
        run: |
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check .

      - name: Static Type Verification
        run: mypy --ignore-missing-imports .

  terraform-security:
    name: Infrastructure Security & Policy Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Setup Terraform Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate Infrastructure Syntax
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Run tfsec Security Policy Scanner
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform

  unit-tests:
    name: Unit Tests & Coverage Verification
    needs: [lint-and-audit, terraform-security]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Pinned Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Run Test Suite (CPU Fallback Guaranteed)
        run: |
          pytest tests/ -v -s --cov=. --cov-fail-under=60
