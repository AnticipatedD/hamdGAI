name: hamdGAI Architecture CI/CD Platform

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]

jobs:
  lint-and-audit:
    name: Code Quality & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Locked Dependencies & Analysis Tools
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then pip install -r requirements-lock.txt; else pip install -e ".[dev]"; fi
          pip install pip-audit flake8 black mypy ruff

      - name: Execute Security Vulnerability Audit
        run: pip-audit || true

      - name: Code Style Check (Black, Flake8 & Ruff)
        run: |
          black --check .
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          ruff check .

      - name: Static Type Checking
        run: mypy --ignore-missing-imports .

  terraform-validate:
    name: Infrastructure IaC Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Setup Terraform Core Engine
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Validate Infrastructure Modules
        run: |
          cd terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  test-and-coverage:
    name: Test Suite & Coverage Verification
    needs: [lint-and-audit, terraform-validate]
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository codebase
        uses: actions/checkout@v4

      - name: Set up Python Runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Runtime & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-lock.txt ]; then pip install -r requirements-lock.txt; else pip install -e ".[dev]"; fi

      - name: Run Test Suite Enforcement
        run: |
          pytest tests/ -v -s --cov=. --cov-fail-under=60 --cov-report=xml

      - name: Upload Coverage Artifacts
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
