[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamdgai"
version = "1.0.0"
description = "Hybrid Agent Model & ROCm Accelerated Compute Engine"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MD ABUL HOSSAIN", email = "bigboss@anticipatedd.io" }
]
dependencies = [
    "pydantic>=2.8.2",
    "pydantic-settings>=2.3.4",
    "structlog>=24.2.0",
    "prometheus-client>=0.20.0",
    "torch>=2.3.1",
    "openai>=1.58.1",
    "python-dotenv>=1.0.1",
    "anyio>=4.4.0",
    "httpx>=0.27.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.2",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.1",
    "mypy>=1.10.1",
    "black>=24.4.2",
    "flake8>=7.0.0",
    "pip-audit>=2.7.3"
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=. --cov-fail-under=60"
