global:
  scrape_interval:     15s # Scrape targets every 15 seconds by default
  evaluation_interval: 15s # Evaluate alert rules every 15 seconds

# Telemetry data collection scrape configurations matrix
scrape_configs:
  - job_name: 'hamdgai-agent-service'
    static_configs:
      # Targets the metrics_exporter.py HTTP server port inside the backend service container
      - targets: ['hamdgai-core-service:9090']
    metrics_path: /
    relabel_configs:
      - target_label: 'environment'
        replacement: 'production-rocm-mi300x'
