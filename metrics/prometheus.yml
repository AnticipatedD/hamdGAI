global:
  scrape_interval:     15s
  evaluation_interval: 15s

# Load alert rule metrics parameters into the runtime engine
rule_files:
  - "/etc/prometheus/alerts.yml"

scrape_configs:
  - job_name: 'hamdgai-agent-service'
    static_configs:
      - targets: ['hamdgai-core-service:9090']
    metrics_path: /
    relabel_configs:
      - target_label: 'environment'
        replacement: 'production-rocm-mi300x'
