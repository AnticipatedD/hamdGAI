user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Enterprise Performance & Logging Matrix Configurations
    log_format json_analytics '{"timestamp":"$time_iso8601",'
                              '"client_ip":"$remote_addr",'
                              '"request":"$request",'
                              '"status":$status,'
                              '"bytes_sent":$body_bytes_sent,'
                              '"upstream_time":"$upstream_response_time"}';

    access_log /var/log/nginx/access_log.json json_analytics;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Upstream container pointer matching your docker-compose target mapping service
    upstream core_agent_backend {
        server hamdgai-core-service:8000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name localhost;

        # Mitigate buffer overflow payload injections at system entry boundaries
        client_max_body_size 2M;

        location / {
            proxy_pass http://core_agent_backend;
            
            # Safe HTTP tracking headers configuration matrices
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Direct configuration adjustments managing real-time token streaming parameters
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # Operational service health check telemetry visibility loop
        location /status-monitor {
            access_log off;
            return 200 '{"gateway_status":"active","target":"hamdGAI-Cluster"}';
            add_header Content-Type application/json;
        }
    }
}
