version: '3.8'

services:
  hamdgai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hamdgai-core-service
    expose:
      - "8000"
      - "9090"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: hamdgai-prometheus
    volumes:
      - ./metrics/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: hamdgai-grafana-viz
    ports:
      - "3000:3000"
    volumes:
      - ./metrics/grafana_dashboard.json:/var/lib/grafana/dashboards/dashboard.json:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - prometheus
    restart: unless-stopped
