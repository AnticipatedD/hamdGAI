version: '3.8'

services:
  hamdgai-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hamdgai-core-service
    expose:
      - "8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/.venv
    restart: unless-stopped

  hamdgai-gateway:
    image: nginx:1.25-alpine
    container_name: hamdgai-nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - hamdgai-backend
    restart: unless-stopped
To fire up the production stack with proxy layers fully enabled, execute: 
```bash
docker compose -f docker-compose.prod.yml up -d --build
